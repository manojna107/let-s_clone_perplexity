<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perplexity – Ask Anything</title>
  <meta name="description" content="A Perplexity-style AI chatbot powered by advanced language models. Ask anything and get instant, intelligent answers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M3 7l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M12 12v10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">perplexity</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" id="nav-search">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Search</span>
        </a>
        <a href="#" class="nav-item" id="nav-computer">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Computer</span>
        </a>
      </nav>

      <button class="new-thread-btn" id="newThreadBtn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New thread
      </button>

      <nav class="sidebar-nav sidebar-links">
        <a href="#" class="nav-item" id="nav-history">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3.05 11a9 9 0 1 1 .5 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 4v7h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>History</span>
        </a>
        <a href="#" class="nav-item" id="nav-discover">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M14.5 9.5L10 14l-1.5-1.5L13 8l1.5 1.5z" fill="currentColor"/></svg>
          <span>Discover</span>
        </a>
        <a href="#" class="nav-item" id="nav-spaces">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span>Spaces</span>
        </a>
        <a href="#" class="nav-item" id="nav-finance">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="16 7 22 7 22 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Finance</span>
        </a>
        <a href="#" class="nav-item" id="nav-health">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 3 14 3 8a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6-9 13-9 13z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Health</span>
        </a>
        <a href="#" class="nav-item" id="nav-more">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="19" cy="12" r="1.5" fill="currentColor"/></svg>
          <span>More</span>
        </a>
      </nav>

      <div class="sidebar-section-label">Recent</div>
      <div class="recent-threads" id="recentThreads">
        <p class="recent-empty">Recent and active threads will appear here.</p>
      </div>
    </div>

    <div class="sidebar-bottom">
      <button class="sign-in-btn" id="signInBtn">
        <div class="sign-in-avatar">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <span>Sign In</span>
        <svg class="chevron-right" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </aside>

  <!-- ===== MOBILE TOGGLE ===== -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <span></span><span></span><span></span>
  </button>

  <!-- PDF UPLOAD STATUS BADGE -->
  <div class="pdf-badge hidden" id="pdfBadge">
    <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <span id="pdfBadgeText">No file</span>
    <button class="pdf-badge-clear" id="pdfClearBtn" title="Remove uploaded PDFs">&times;</button>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main" id="mainContent">

    <!-- HOME VIEW -->
    <section class="home-view" id="homeView">
      <div class="home-hero">
        <h1 class="hero-title">perplexity</h1>

        <!-- Search Box -->
        <div class="search-container">
          <div class="search-box" id="searchBox">
            <textarea
              class="search-input"
              id="searchInput"
              placeholder="Type @ for connectors and sources"
              rows="1"
              autocomplete="off"
              spellcheck="false"
            ></textarea>

            <div class="search-toolbar">
              <div class="toolbar-left">
                <!-- ROBUST LAPTOP UPLOAD: Uses label + hidden input pattern (force-opens laptop file explorer) -->
                <label class="toolbar-btn text-btn" id="attachBtnLabel" for="pdfFileInput" title="Upload directly from laptop">
                  <svg viewBox="0 0 24 24" fill="none" width="16" height="16" style="margin-right: 6px;"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                  Laptop Content
                  <input type="file" id="pdfFileInput" accept=".pdf" style="display:none;" />
                </label>
                <button class="toolbar-chip" id="modelChip">
                  💻 Computer <span style="opacity: 0.5;">+</span>
                </button>
              </div>

              <div class="toolbar-right">
                <button class="toolbar-chip model-selector" id="modelSelector">
                  Model
                  <svg viewBox="0 0 24 24" fill="none" width="12" height="12"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="micBtn" title="Voice input">
                  <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M19 10a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 19v3M9 22h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
                <button class="send-btn" id="sendBtn" title="Send message">
                   <svg viewBox="0 0 24 24" fill="none" width="24" height="24">
                     <circle cx="12" cy="12" r="12" fill="#fff"/>
                     <path d="M10 8l4 4-4 4" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                   </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions-section">
          <div class="quick-actions-header">
            💻 Try Computer
          </div>
          <div class="quick-chips">
            <button class="quick-chip" data-prompt="Create a prototype for my idea">
              &lt;/&gt; Create a prototype
            </button>
            <button class="quick-chip" data-prompt="Help me learn">
              💡 Help me learn
            </button>
            <button class="quick-chip" data-prompt="Build a business">
              💼 Build a business
            </button>
            <button class="quick-chip" data-prompt="Monitor the situation">
              👁️ Monitor the situation
            </button>
          </div>

          <div class="suggested-prompts" id="suggestedPrompts">
            <button class="suggested-prompt" data-prompt="Create an internal tool for my team">Create an internal tool for my team</button>
            <button class="suggested-prompt" data-prompt="Create a mobile app prototype for my idea">Create a mobile app prototype for my idea</button>
            <button class="suggested-prompt" data-prompt="Set up an automated email or Slack workflow">Set up an automated email or Slack workflow</button>
            <button class="suggested-prompt" data-prompt="Build a working landing page for my product">Build a working landing page for my product</button>
            <button class="suggested-prompt" data-prompt="Build a dashboard tracking my business metrics">Build a dashboard tracking my business metrics</button>
          </div>
        </div>
      </div>
    </section>

    <!-- CHAT VIEW -->
    <section class="chat-view hidden" id="chatView">
      <div class="chat-header">
        <div class="chat-title" id="chatTitle">New Thread</div>
        <div class="chat-header-actions">
          <button class="icon-btn header-btn" title="Share">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <!-- Chat Input -->
      <div class="chat-input-area">
        <div class="search-box chat-search-box" id="chatSearchBox">
          <textarea
            class="search-input"
            id="chatInput"
            placeholder="Ask a follow-up..."
            rows="1"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <div class="search-toolbar">
            <div class="toolbar-left">
              <!-- ROBUST LAPTOP UPLOAD (CHAT REPEAT): Force-opens laptop file explorer -->
              <label class="toolbar-btn icon-btn" for="pdfFileInputChat" title="Upload directly from laptop">
                <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="file" id="pdfFileInputChat" accept=".pdf" style="display:none;" />
              </label>
            </div>
            <div class="toolbar-right">
              <button class="toolbar-btn icon-btn" title="Voice input">
                <svg viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M19 10a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 19v3M9 22h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              </button>
              <button class="send-btn" id="chatSendBtn" title="Send message">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8 12h8M13 8l4 4-4 4" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODEL SELECTOR DROPDOWN -->
  <div class="dropdown-overlay hidden" id="modelDropdown">
    <div class="dropdown-menu">
      <div class="dropdown-label">Select Model</div>
      <button class="dropdown-item active" data-model="gpt-4o">
        <div class="dropdown-item-icon">⚡</div>
        <div>
          <div class="dropdown-item-name">GPT-4o</div>
          <div class="dropdown-item-desc">Fast & highly capable</div>
        </div>
        <svg class="check-icon" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="dropdown-item" data-model="claude-3.5-sonnet">
        <div class="dropdown-item-icon">🧠</div>
        <div>
          <div class="dropdown-item-name">Claude 3.5 Sonnet</div>
          <div class="dropdown-item-desc">Thoughtful & nuanced</div>
        </div>
      </button>
      <button class="dropdown-item" data-model="gemini-2.0-flash">
        <div class="dropdown-item-icon">✨</div>
        <div>
          <div class="dropdown-item-name">Gemini 2.0 Flash</div>
          <div class="dropdown-item-desc">Google's latest model</div>
        </div>
      </button>
      <button class="dropdown-item" data-model="sonar-pro">
        <div class="dropdown-item-icon">🔍</div>
        <div>
          <div class="dropdown-item-name">Sonar Pro</div>
          <div class="dropdown-item-desc">Web search enhanced</div>
        </div>
      </button>
    </div>
  </div>

  <!-- OVERLAY FOR SIDEBAR ON MOBILE -->
  <div class="sidebar-overlay hidden" id="sidebarOverlay"></div>

  <!-- UPLOAD PROGRESS OVERLAY -->
  <div class="upload-overlay hidden" id="uploadOverlay">
    <div class="upload-card">
      <div class="upload-spinner"></div>
      <h3>Processing PDF...</h3>
      <p id="uploadStatusText">Extracting text from your document</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
